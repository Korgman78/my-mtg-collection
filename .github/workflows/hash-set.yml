name: Index set for scanner

# Construit la base de référence perceptuelle du scanner.
#
# La référence vit dans Supabase : elle se construit UNE fois et sert à tous
# les appareils. Le job est reprenable — relancé, il saute ce qui est déjà
# indexé, donc l'interrompre ne coûte rien.
#
# Débit mesuré : 0,21 s par carte, soit ~24 min pour les 15 sets principaux
# des deux dernières années (~7 000 cartes), ~1 min 30 pour un set seul.

on:
  workflow_dispatch:
    inputs:
      sets:
        description: '« --main-sets » pour les sets principaux récents, ou des codes séparés par des espaces (ex : otj mh3)'
        required: true
        default: '--main-sets'
        type: string

concurrency:
  group: hash-set
  cancel-in-progress: false

jobs:
  hash:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Node 24 : le job importe directement mobile/src/lib/phash.ts grâce au
      # strip-types natif. C'est ce qui garantit que la référence et l'app
      # calculent le même hachage — pas deux implémentations « équivalentes ».
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Le pHash est le contrat entre ce job et l'app : s'il a bougé, les
      # hachages déjà en base deviennent incomparables. On refuse d'écrire.
      - name: Vérifier le pHash et le décodeur PNG
        run: |
          node scripts/phash-selftest.mjs
          node scripts/png-selftest.mjs

      - name: Indexer les sets
        run: node scripts/hash-set.mjs ${{ inputs.sets }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
