name: Daily price ingestion

on:
  schedule:
    # 04:30 UTC : les bulk Scryfall sont régénérés dans la nuit (heure US).
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Un run bloque ne doit jamais paralyser les suivants.
#
# `cancel-in-progress: false` semblait prudent : ne pas interrompre une
# ingestion en cours d'ecriture. Le 2026-08-19, un run declenche a la main
# est reste « queued » 26 heures sans jamais demarrer, et comme il tenait le
# groupe, tout ce qui venait derriere attendait. Une panne de quelques
# minutes est devenue un silence de deux jours.
#
# L'ingestion est idempotente : les releves sont inseres sur la cle
# (card_id, snapped_on), l'archive du jour est reecrite telle quelle. Rien
# ne justifie donc de proteger un run ancien contre un run plus recent —
# c'est meme l'inverse qu'on veut, le plus recent porte les prix du jour.
concurrency:
  group: ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ingest Scryfall prices
        run: node scripts/ingest.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Send immediate alert emails
        run: node scripts/send-digest.mjs --mode immediate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}

      - name: Commit daily archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # On indexe AVANT de rebaser. L'archive du jour peut deja exister et
          # etre suivie — run relance, ou ingestion lancee a la main — auquel
          # cas la reecrire produit une modification non indexee, et
          # `git pull --rebase` refuse de tourner sur un arbre sale :
          # « cannot pull with rebase: You have unstaged changes ».
          git add archives/
          git diff --cached --quiet || git commit -m "prices: archive $(date -u +%F)"
          git pull --rebase
          git push
